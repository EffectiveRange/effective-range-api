name: CI

on:
  push:
    branches: [ main ]
    tags: [ v*.*.* ]

  release:
    types: [ published ]

  pull_request:
    branches: [ main ]
    types:
      - synchronize
      - opened
      - reopened

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install OpenAPI validator
        run: python -m pip install openapi-spec-validator==0.7.2

      - name: Validate OpenAPI specification
        run: python -m openapi_spec_validator openapi/effective-range-api.yaml

  release:
    needs: validate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.release.tag_name || github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install YAML converter
        run: |
          sudo apt-get update
          sudo apt-get install --yes yq

      - name: Verify release version
        run: |
          tag_version="${RELEASE_TAG#v}"
          spec_version=$(yq -er '.info.version' openapi/effective-range-api.yaml)
          if [ "$tag_version" != "$spec_version" ]; then
            echo "::error::Tag version '$tag_version' does not match info.version '$spec_version'"
            exit 1
          fi

      - name: Prepare release artifacts
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          cp openapi/effective-range-api.yaml "dist/effective-range-api_${version}.yaml"
          yq '.' openapi/effective-range-api.yaml > "dist/effective-range-api_${version}.json"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" |
            jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id')

          if [ -n "$release_id" ]; then
            notes=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$RELEASE_TAG" --jq '.body')
            gh release edit "$RELEASE_TAG" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            "dist/effective-range-api_${version}.yaml" \
            "dist/effective-range-api_${version}.json"
